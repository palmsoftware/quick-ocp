---
name: Test Changes

# Docs-only changes skip the full suite. paths-ignore only skips when every
# changed file matches, so a PR that touches any non-Markdown file still runs
# everything. Safe because no status check from this workflow is required by
# the main ruleset (a required check would stay pending forever when skipped).
'on':
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      - name: Lint shell scripts
        run: make lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install BATS
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 10
          command: |
            sudo apt-get install -y bats

      - name: Run BATS unit tests
        run: make test

  check-cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Quay cache images exist for all pinned OCP versions
        run: make check-image-cache

  verify-cache-images:
    uses: ./.github/workflows/_verify-cache-images.yml

  ocp-tests:
    uses: ./.github/workflows/reusable-ocp-tests.yml
    with:
      skip-dependabot: true
    secrets: inherit
